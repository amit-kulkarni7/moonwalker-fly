# REFINED VISUALIZATION CONFIGURATION FOR DROSOPHILA MELANOGASTER (V2)
# Refined for natural muted amber-brown chitin, deep burgundy eyes,
# clean non-noisy abdominal segmentation, and transparent glassy wings.

wing:
  apply_to: "*_wing"
  material:
    specular: 0.25
    shininess: 0.20
    rgba: [0.68, 0.72, 0.75, 0.13]

eye:
  apply_to: "*_eye"
  material:
    specular: 0.40
    shininess: 0.50
    rgba: [0.44, 0.07, 0.07, 1.0]

